<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Jeopardy! — Deepavali Edition</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<svg class="bg-arch tl" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M100 10 L180 90 C190 100 190 110 190 120 L190 210 L10 210 L10 120 C10 110 10 100 20 90 Z" stroke="#FFD060" stroke-width="4"/>
</svg>
<svg class="bg-arch br" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M100 10 L180 90 C190 100 190 110 190 120 L190 210 L10 210 L10 120 C10 110 10 100 20 90 Z" stroke="#FFD060" stroke-width="4"/>
</svg>

<div class="app">
  <div class="topbar">
    <div style="width:110px;"></div>
    <div class="title-block">
      <div class="eyebrow">Tamil &times; Kannada &times; Malayalam</div>
      <h1>Namma Jeopardy!</h1>
    </div>
    <button class="reset-btn" id="resetBtn">Reset Game</button>
  </div>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="board" id="board"></div>

  <footer>Tamil Sangam &bull; Malayalee Society &bull; Kannada Sangha &mdash; Namma Deepavali</footer>
</div>

<!-- Clue / Answer full-screen view -->
<div class="clue-screen hidden" id="clueScreen">
  <div class="clue-meta" id="clueMeta"></div>

  <div id="clueStage">
    <div class="clue-label">Your Clue</div>
    <div class="clue-text" id="clueText"></div>
    <div class="btn-row">
      <button class="btn" id="revealBtn">Reveal Answer</button>
      <button class="btn secondary" id="backFromClueBtn">Back to Board</button>
    </div>
  </div>

  <div id="answerStage" style="display:none;">
    <div class="clue-label">The Answer Is</div>
    <div class="answer-block">
      <div class="answer-text" id="answerText"></div>
      <div class="answer-tag" id="answerTag"></div>
    </div>

    <div class="award-heading">Who got it right?</div>
    <div class="award-row" id="awardRow"></div>

    <div class="back-btn-wrap">
      <button class="btn secondary" id="backFromAnswerBtn">Back to Board</button>
    </div>
  </div>
</div>

<!-- Reset confirmation modal -->
<div class="modal-overlay hidden" id="resetModal">
  <div class="modal">
    <p>Reset the whole game? This clears every used clue and all team scores.</p>
    <div class="btn-row">
      <button class="btn" id="confirmResetBtn">Yes, Reset</button>
      <button class="btn secondary" id="cancelResetBtn">Cancel</button>
    </div>
  </div>
</div>

<!-- Manual score adjust modal -->
<div class="modal-overlay hidden" id="scoreModal">
  <div class="modal">
    <p id="scoreModalLabel"></p>
    <div class="score-adjust-row">
      <button id="scoreMinus">&minus;</button>
      <div class="value" id="scoreModalValue">0</div>
      <button id="scorePlus">+</button>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="closeScoreModal">Done</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
