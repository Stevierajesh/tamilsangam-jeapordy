<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Jeopardy! — Deepavali Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=EB+Garamond:ital,wght@0,500;1,500&display=swap');

:root { --u: min(1vw, 1.7778vh); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0215; }
body { display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif; }

.slide {
  position: relative;
  width: calc(var(--u) * 100);
  height: calc(var(--u) * 56.25);
  overflow: hidden;
  background-image: url('jeopardy/assets/bg-title.png');
  background-size: cover;
  background-position: center;
}

.box { position: absolute; }
img.art { position: absolute; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

.frame {
  left: 2.475%; top: 3.867%; width: 95.025%; height: 92.133%;
  background: #2d0a55;
  border: calc(var(--u) * 0.1144) solid #ffd060;
  border-radius: calc(var(--u) * 0.6);
}

.line { position: absolute; background: #ffd060; height: calc(var(--u) * 0.1197); }
.dot { position: absolute; background: #ffd060; border-radius: 50%; }

.txt { position: absolute; text-align: center; line-height: 1.15; }
.garamond { font-family: 'EB Garamond', serif; line-height: 1.2; }

.eyebrow { font-weight: 700; letter-spacing: 0.3em; color: #ffe4a4; font-size: calc(var(--u) * 1.354); }
.namma { font-weight: 800; color: #fff7e8; font-size: calc(var(--u) * 1.771); letter-spacing: 0.04em; }
.script-title { font-weight: 500; color: #ffe4a4; font-size: calc(var(--u) * 8.646); }
.divider { height: calc(var(--u) * 0.1249); }
.tagline { font-style: italic; color: #fff7e8; font-size: calc(var(--u) * 2.1875); }
.pillbar { background: #230443; border-radius: calc(var(--u) * 2); }
.pillbar-text { font-weight: 700; letter-spacing: 0.1em; color: #fff7e8; font-size: calc(var(--u) * 1.146); display: flex; align-items: center; justify-content: center; }
.sub-languages { font-weight: 500; letter-spacing: 0.08em; color: #ffe4a4; font-size: calc(var(--u) * 1.667); }

.start-btn {
  display: flex; align-items: center; justify-content: center;
  background: #ffd060; color: #2d0a55; border: none; cursor: pointer;
  font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  border-radius: calc(var(--u) * 3);
  font-size: calc(var(--u) * 1.4);
  box-shadow: 0 0 calc(var(--u) * 1.5) rgba(255, 208, 96, 0.45);
  transition: filter 0.12s ease;
}
.start-btn:hover { filter: brightness(1.1); }

.setup-label {
  font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase;
  color: #ffe4a4; font-size: calc(var(--u) * 1.15);
}

.team-input {
  background: rgba(10, 2, 21, 0.55);
  border: calc(var(--u) * 0.08) solid #ffd060;
  border-radius: calc(var(--u) * 2.5);
  color: #fff7e8;
  font-family: 'Inter', sans-serif;
  font-size: calc(var(--u) * 1.3);
  padding: 0 4%;
  outline: none;
}
.team-input::placeholder { color: rgba(248, 233, 210, 0.5); }

.add-btn {
  background: transparent;
  border: calc(var(--u) * 0.08) solid #ffe4a4;
  color: #ffe4a4;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: calc(var(--u) * 1.1);
  border-radius: calc(var(--u) * 2.5);
  cursor: pointer;
  transition: all 0.12s ease;
}
.add-btn:hover { background: #ffe4a4; color: #2d0a55; }

.chips-wrap {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
  gap: calc(var(--u) * 0.8);
  overflow-y: auto;
}

.team-chip {
  display: inline-flex;
  align-items: center;
  gap: calc(var(--u) * 0.6);
  background: rgba(135, 51, 186, 0.35);
  border: calc(var(--u) * 0.06) solid #ffd060;
  border-radius: calc(var(--u) * 2);
  padding: calc(var(--u) * 0.4) calc(var(--u) * 1.1);
  color: #f8e9d2;
  font-weight: 700;
  font-size: calc(var(--u) * 1.15);
  height: fit-content;
}
.team-chip button {
  background: transparent;
  border: none;
  color: #fc485a;
  font-size: calc(var(--u) * 1.4);
  line-height: 1;
  cursor: pointer;
  padding: 0;
}
.team-chip button:hover { color: #ff8b58; }

.setup-hint {
  color: #fc485a;
  font-weight: 700;
  font-size: calc(var(--u) * 1.05);
  display: none;
}
.setup-hint.show { display: block; }
</style>
</head>
<body>
<div class="slide">
  <div class="box frame"></div>
  <div class="box line" style="left:3.675%;top:6.267%;width:18.075%;"></div>
  <div class="box line" style="left:78.225%;top:6.267%;width:18.075%;"></div>
  <img class="art box" src="jeopardy/assets/mandala.png" style="left:1.875%;top:7.467%;width:18.45%;height:32.8%;" />
  <img class="art box" src="jeopardy/assets/mandala.png" style="left:79.425%;top:7.467%;width:18.45%;height:32.8%;" />
  <img class="art box" src="jeopardy/assets/lotus.png" style="left:41.1%;top:1.733%;width:18%;height:18.56%;" />

  <div class="txt eyebrow box" style="left:28.2%;top:21.067%;width:43.5%;height:4.133%;">TS &times; MS &times; KS</div>
  <div class="txt namma box" style="left:15%;top:27.6%;width:69.975%;height:7.333%;">NAMMA</div>
  <div class="txt garamond script-title box" style="left:10.725%;top:32.667%;width:78.6%;height:18%;">Jeopardy!</div>

  <div class="box line divider" style="left:30.6%;top:53.733%;width:38.775%;"></div>
  <div class="box dot" style="left:49.657%;top:53.187%;width:0.675%;height:1.2%;"></div>
  <div class="box dot" style="left:48.862%;top:53.333%;width:0.45%;height:0.8%;"></div>
  <div class="box dot" style="left:50.663%;top:53.333%;width:0.45%;height:0.8%;"></div>

  <div class="txt garamond tagline box" style="left:15.75%;top:56.8%;width:68.475%;height:6.667%;">The ultimate South Indian culture showdown</div>

  <img class="art box" src="jeopardy/assets/diya.png" style="left:3%;top:65%;width:11%;height:15.3%;" />
  <img class="art box" src="jeopardy/assets/diya.png" style="left:86%;top:65%;width:11%;height:15.3%;" />

  <div class="txt setup-label box" style="left:20%;top:64.7%;width:60%;height:2.8%;">Add Your Teams</div>

  <form id="teamForm" class="box" style="left:19%;top:68.3%;width:62%;height:6%;display:flex;gap:2%;" autocomplete="off">
    <input id="teamInput" class="team-input" style="flex:1;height:100%;" type="text" maxlength="24" placeholder="Enter a team name" />
    <button type="submit" class="add-btn" style="width:22%;height:100%;">Add</button>
  </form>

  <div id="chipsWrap" class="chips-wrap box" style="left:14%;top:75.2%;width:72%;height:10.5%;"></div>

  <div id="setupHint" class="txt setup-hint box" style="left:20%;top:86.1%;width:60%;height:2.2%;">Add at least one team to start</div>

  <button class="start-btn box" id="startBtn" style="left:38%;top:89%;width:24%;height:6.3%;">Start Game</button>
</div>

<script>
  const CHIPS_KEY = "namma-jeopardy-teams";
  let teams = [];

  const chipsWrap = document.getElementById("chipsWrap");
  const teamForm = document.getElementById("teamForm");
  const teamInput = document.getElementById("teamInput");
  const setupHint = document.getElementById("setupHint");

  function renderChips() {
    chipsWrap.innerHTML = "";
    teams.forEach(team => {
      const chip = document.createElement("div");
      chip.className = "team-chip";
      const name = document.createElement("span");
      name.textContent = team.name;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.setAttribute("aria-label", "Remove " + team.name);
      remove.textContent = "×";
      remove.addEventListener("click", () => {
        teams = teams.filter(t => t.id !== team.id);
        renderChips();
      });
      chip.appendChild(name);
      chip.appendChild(remove);
      chipsWrap.appendChild(chip);
    });
  }

  function addTeam(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    teams.push({ id: "t" + Date.now() + Math.random().toString(36).slice(2, 7), name: trimmed });
    renderChips();
    setupHint.classList.remove("show");
  }

  teamForm.addEventListener("submit", (e) => {
    e.preventDefault();
    addTeam(teamInput.value);
    teamInput.value = "";
    teamInput.focus();
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    if (teams.length === 0) {
      setupHint.classList.add("show");
      teamInput.focus();
      return;
    }
    localStorage.setItem(CHIPS_KEY, JSON.stringify(teams));
    localStorage.removeItem("namma-jeopardy-state-v2");
    window.location.href = "jeopardy/";
  });
</script>
</body>
</html>
